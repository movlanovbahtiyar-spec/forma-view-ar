openapi: 3.1.0
info:
  title: Forma View Scan API
  version: 1.0.0
paths:
  /v1/scans:
    post:
      summary: Create a metered object-capture job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [captureId, unit, scaleSource, upload]
              properties:
                captureId: { type: string, format: uuid }
                unit: { type: string, enum: [meter] }
                scaleSource: { type: string, enum: [lidar, referenceCard, operatorVerified] }
                confidence: { type: number, minimum: 0, maximum: 1 }
                dimensionsMeters:
                  type: object
                  properties:
                    width: { type: number, exclusiveMinimum: 0 }
                    height: { type: number, exclusiveMinimum: 0 }
                    depth: { type: number, exclusiveMinimum: 0 }
                upload:
                  type: object
                  required: [archiveUrl]
                  properties: { archiveUrl: { type: string, format: uri } }
      responses:
        '202': { description: Accepted; reconstruction queued }
  /v1/scans/{captureId}:
    get:
      summary: Read scan processing and scale validation status
      parameters:
        - in: path
          name: captureId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Job state, model assets, validation result }

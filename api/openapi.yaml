openapi: 3.1.0
info:
  title: Forma View Scan API
  version: 1.0.0
paths:
  /v1/scans:
    post:
      summary: Create a metered object-capture job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, assets]
              properties:
                manifest:
                  type: object
                  required: [captureID, unit, scaleSource, confidence]
                  properties:
                    captureID: { type: string, format: uuid }
                    unit: { type: string, enum: [meter] }
                    scaleSource: { type: string, enum: [lidar, referenceCard, operatorVerified] }
                    confidence: { type: number, minimum: 0, maximum: 1 }
                assets:
                  type: array
                  items:
                    type: object
                    required: [relativePath, contentType, byteCount]
                    properties:
                      relativePath: { type: string }
                      contentType: { type: string }
                      byteCount: { type: integer, minimum: 1 }
      responses:
        '201': { description: Scan ID and signed PUT upload targets }
  /v1/scans/{captureId}/complete:
    post:
      summary: Mark every signed upload as complete and queue reconstruction
      parameters:
        - in: path
          name: captureId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Accepted; reconstruction queued }
  /v1/scans/{captureId}:
    get:
      summary: Read scan processing and scale validation status
      parameters:
        - in: path
          name: captureId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Job state, model assets, validation result }
